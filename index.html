<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Mini-Car Telemetry</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b1220;color:#e2e8f0}
.card{background:#111827;border:1px solid #1e293b;border-radius:1rem}
.chart-wrap{position:relative;height:220px}
</style>
</head>
<body>
<div class="max-w-6xl mx-auto px-4 py-6 space-y-4">
<header class="flex flex-wrap items-center justify-between gap-3">
<div><h1 class="text-2xl font-bold">Space Mini-Car Telemetry</h1>
<p class="text-sm text-slate-400">Chrome or Edge only. Close the Arduino Serial Monitor first.</p></div>
<div class="flex items-center gap-2">
<span id="statusBadge" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700">Offline</span>
<button id="connectBtn" type="button" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-sm">Connect USB Port</button>
</div></header>
<p id="errorBox" class="hidden text-sm text-red-300 bg-red-950/50 border border-red-800 rounded-xl px-4 py-3"></p>
<div id="warningBanner" class="hidden text-sm text-red-200 bg-red-950/40 border border-red-700 rounded-xl px-4 py-3">Warning</div>
<section class="grid md:grid-cols-3 gap-3">
<div class="card p-4"><p class="text-xs text-slate-400">Temperature</p><p class="text-3xl text-orange-400"><span id="tempVal">--</span> C</p></div>
<div class="card p-4"><p class="text-xs text-slate-400">Humidity</p><p class="text-3xl text-cyan-400"><span id="humVal">--</span> %</p></div>
<div class="card p-4"><p class="text-xs text-slate-400">Light</p><p class="text-3xl text-amber-300"><span id="ldrVal">--</span> ADC</p></div>
</section>
<section class="grid lg:grid-cols-3 gap-3">
<div class="card p-3"><p class="text-sm text-orange-300 mb-1">Temperature vs time</p><div class="chart-wrap"><canvas id="tempChart"></canvas></div></div>
<div class="card p-3"><p class="text-sm text-cyan-300 mb-1">Humidity vs time</p><div class="chart-wrap"><canvas id="humChart"></canvas></div></div>
<div class="card p-3"><p class="text-sm text-amber-300 mb-1">Light vs time</p><div class="chart-wrap"><canvas id="ldrChart"></canvas></div></div>
</section>
<div class="card p-3 h-40 overflow-y-auto font-mono text-xs" id="serialLog">Port closed.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
function showError(msg){var b=document.getElementById('errorBox');b.textContent=msg;b.classList.remove('hidden');}
function logLine(text){var el=document.getElementById('serialLog');var row=document.createElement('div');row.textContent='['+new Date().toLocaleTimeString()+'] '+text;el.appendChild(row);el.scrollTop=el.scrollHeight;}
var port=null, reader=null, keepReading=false;
var charts=[];
var history={labels:[],temp:[],hum:[],ldr:[]};
function setupCharts(){
  if(typeof Chart==='undefined'){showError('Charts library did not load. USB connect still works. Numbers will show, graphs will not.');return;}
  function make(id,color,a,b){return new Chart(document.getElementById(id),{type:'line',data:{labels:[],datasets:[{data:[],borderColor:color,borderWidth:2,pointRadius:0,tension:0.25,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#64748b',maxTicksLimit:5}},y:{suggestedMin:a,suggestedMax:b,ticks:{color:'#64748b'}}}}});}
  charts=[make('tempChart','#fb923c',0,40),make('humChart','#22d3ee',0,100),make('ldrChart','#fcd34d',0,1023)];
}
function pushPoint(temp,hum,ldr){
  if(!charts.length)return;
  var t=new Date().toLocaleTimeString();
  history.labels.push(t);history.temp.push(temp);history.hum.push(hum);history.ldr.push(ldr);
  if(history.labels.length>60){history.labels.shift();history.temp.shift();history.hum.shift();history.ldr.shift();}
  var series=[history.temp,history.hum,history.ldr];
  charts.forEach(function(c,i){c.data.labels=history.labels;c.data.datasets[0].data=series[i];c.update('none');});
}
function parseLine(line){
  var tm=line.match(/Temp:\s*([-\d.]+)\s*C/i), hm=line.match(/Hum:\s*([-\d.]+)\s*%/i), lm=line.match(/LDR:\s*(\d+)/i);
  if(!tm||!hm||!lm)return;
  var temp=parseFloat(tm[1]), hum=parseFloat(hm[1]), ldr=parseInt(lm[1],10);
  document.getElementById('tempVal').textContent=temp.toFixed(1);
  document.getElementById('humVal').textContent=hum.toFixed(1);
  document.getElementById('ldrVal').textContent=String(ldr);
  var warn=temp<10||hum<60;
  var banner=document.getElementById('warningBanner');
  banner.classList.toggle('hidden',!warn);
  if(warn)banner.textContent='Warning: temp '+temp+' C < 10 or humidity '+hum+'% < 60';
  pushPoint(temp,hum,ldr);
}
function setStatus(on){
  var b=document.getElementById('statusBadge'), btn=document.getElementById('connectBtn');
  b.textContent=on?'Online':'Offline';
  btn.textContent=on?'Disconnect':'Connect USB Port';
}
async function connectSerial(){
  if(!('serial' in navigator)){
    showError('This browser has no Web Serial. Use Google Chrome or Microsoft Edge on a computer. Phones cannot connect. Do not open a downloaded file.');
    return;
  }
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:9600});
    keepReading=true; setStatus(true); logLine('Port open at 9600');
    readLoop();
  }catch(err){
    var msg=err&&err.message?err.message:String(err);
    logLine('Connect failed: '+msg);
    showError('Connect failed: '+msg+'. Close the Arduino Serial Monitor, then try again.');
    setStatus(false);
  }
}
async function disconnectSerial(){
  keepReading=false;
  try{ if(reader) await reader.cancel(); }catch(e){}
  try{ if(port) await port.close(); }catch(e){}
  reader=null; port=null; setStatus(false); logLine('Closed');
}
async function readLoop(){
  var decoder=new TextDecoderStream();
  port.readable.pipeTo(decoder.writable).catch(function(){});
  reader=decoder.readable.getReader();
  var buffer='';
  try{
    while(keepReading){
      var result=await reader.read();
      if(result.done) break;
      buffer+=result.value||'';
      var i;
      while((i=buffer.indexOf('\n'))>=0){
        var line=buffer.slice(0,i).replace(/\r$/,'').trim();
        buffer=buffer.slice(i+1);
        if(!line) continue;
        logLine(line); parseLine(line);
      }
    }
  }catch(err){ if(keepReading) logLine('Read error: '+(err.message||err)); }
}
document.getElementById('connectBtn').addEventListener('click', function(){
  if(port) disconnectSerial(); else connectSerial();
});
setupCharts();
if(location.protocol==='file:') showError('You opened a downloaded file. That cannot use USB. Use https://aiernest817.github.io/space/ in Chrome or Edge.');
</script>
</body>
</html>
